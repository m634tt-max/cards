<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1c2430">
  <meta name="description" content="Карточки для изучения английского с картинками">
  <title>Карточки</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- ──── Верхняя панель ──── -->
  <header class="topbar">
    <button class="icon-btn" id="btnBack" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="topTitle">Карточки</h1>
    <button class="profile-chip" id="btnProfile" aria-label="Профиль"></button>
  </header>

  <!-- ──── Основная область (экраны рисуются из app.js) ──── -->
  <main id="view"></main>

  <!-- ──── Нижняя навигация ──── -->
  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="tab">
      <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
      <span>Учить</span>
    </button>
    <button data-tab="library" class="tab">
      <svg viewBox="0 0 24 24"><path d="M3 5h7a2 2 0 012 2v13a2 2 0 00-2-2H3zM21 5h-7a2 2 0 00-2 2v13a2 2 0 012-2h7z"/></svg>
      <span>Колоды</span>
    </button>
    <button data-tab="more" class="tab">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>Ещё</span>
    </button>
  </nav>

  <!-- ──── Модальное окно и всплывающие сообщения ──── -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <input type="file" id="fileInput" hidden>

  <script src="vendor/jszip.min.js"></script>
  <script src="db.js"></script>
  <script src="srs.js"></script>
  <script src="app.js"></script>
  <script src="importer.js"></script>
  <script src="screens.js"></script>
  <script src="more.js"></script>
  <script src="study.js"></script>
  <script src="main.js"></script>
</body>
</html>
